<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>爆鍋煉金 原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Noto+Serif+TC:wght@400;600;900&display=swap">
<style>
/* Direction: 17th-c. alchemical engraving, hand-coloured. Paper, bistre ink, a few pigment washes.
   Pigments: vermilion (fire), azurite (water), terre-verte (earth), smalt (air), gold leaf (score). */
:root {
  color-scheme: light;
  --paper: #e8dcc0;
  --paper-2: #dccdab;
  --paper-3: #cbb88f;
  --ink: #2a1c12;
  --ink-2: #5a4532;
  --ink-3: #8a7458;
  --fire: #b8381e;
  --water: #2e5e8c;
  --earth: #5e6a2a;
  --air: #6a5f8e;
  --gold: #a87814;
  --gold-hi: #e8c35a;
  --f-latin: "IM Fell English", "Noto Serif TC", Georgia, serif;
  --f-sc: "IM Fell English SC", "IM Fell English", Georgia, serif;
  --f-body: "Noto Serif TC", "IM Fell English", "PMingLiU", "Songti TC", serif;
  --f-num: "Noto Serif TC", Georgia, serif;
}
.num, .goalbox .big, .card .r .n, .card .r .s, .card .sum span:nth-child(even), .card .gold .v, .money, .item .pr, .tool .tc, .hist div span:last-child { font-family: var(--f-num) !important; font-variant-numeric: lining-nums tabular-nums; }
[hidden] { display: none !important; }
body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 4; background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 55%, rgba(90,60,30,.22) 100%); }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background-color: #ddcfae; background-attachment: fixed; background-position: 0 0;
  color: var(--ink); font-family: var(--f-body); overflow: hidden;
}
#app {
  height: 100vh; display: grid; gap: 8px 16px;
  grid-template-columns: var(--cw, 900px) minmax(300px, 500px);
  grid-template-rows: auto auto 1fr;
  padding: 8px 16px 10px; width: fit-content; max-width: 100vw; margin: 0 auto;
}
header.top { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 16px; border-bottom: 1px solid var(--ink-3); padding-bottom: 6px; }
.brand { display: flex; align-items: baseline; gap: 12px; }
h1 { margin: 0; font-family: var(--f-body); font-weight: 900; font-size: 24px; letter-spacing: .12em; }
h1 .lat { font-family: var(--f-sc); font-weight: 400; font-size: 17px; letter-spacing: .06em; color: var(--ink-2); margin-left: 6px; }
.stagebar { font-family: var(--f-body); font-size: 14px; color: var(--ink-2); display: flex; align-items: baseline; gap: 10px; }
.stagebar b { font-weight: 900; color: var(--ink); font-size: 16px; }
.stagebar .lat { font-family: var(--f-latin); font-style: italic; }
.top-actions { display: flex; gap: 6px; }
button { font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--ink-2); border-radius: 2px; padding: 5px 12px; cursor: pointer; }
button:hover:not(:disabled) { background: rgba(90, 69, 50, .1); }
button:focus-visible { outline: 2px solid var(--fire); outline-offset: 2px; }
button:disabled { opacity: .4; cursor: not-allowed; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); font-weight: 600; }
button.primary:hover:not(:disabled) { background: #48331f; }
kbd { font-family: var(--f-num); font-size: .85em; border: 1px solid var(--ink-3); border-bottom-width: 2px; padding: 0 4px; border-radius: 2px; color: var(--ink-2); background: rgba(255,255,255,.25); }

.stage { grid-column: 1; grid-row: 2; position: relative; justify-self: start; }
canvas#view { display: block; touch-action: none; cursor: crosshair; }
.under { grid-column: 1; grid-row: 3; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: start; min-height: 0; }
.hand { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.vial { position: relative; display: grid; grid-template-columns: 34px minmax(0,1fr); gap: 2px 8px; text-align: left; padding: 6px 8px; height: 100px; overflow: hidden; align-content: start;
  background: rgba(244, 236, 214, .55); border: 1px solid var(--ink-3); transition: transform .12s, box-shadow .12s, border-color .12s; }
.vial canvas { grid-row: 1 / span 3; width: 34px; height: 60px; }
.vial .nm { font-weight: 900; font-size: 17px; line-height: 1.2; }
.vial .nm .k { float: right; font-weight: 400; }
.vial .ds { font-size: 12.5px; line-height: 1.45; color: var(--ink-2); }
.vial:hover:not(:disabled) { transform: translateY(-2px); }
.vial.sel { border-color: var(--ink); box-shadow: 0 0 0 2px var(--ink), 4px 4px 0 rgba(42,28,18,.25); transform: translateY(-4px); background: rgba(250, 244, 226, .85); }
.vial.new { animation: drawin .35s ease-out; }
@keyframes drawin { from { transform: translateY(18px); opacity: 0; } }
.vial.empty { border-style: dashed; opacity: .5; height: 100px; display: grid; place-items: center; font-size: 13px; color: var(--ink-3); }
.decknote { grid-column: 1 / -1; font-size: 12px; line-height: 16px; height: 16px; overflow: hidden; color: var(--ink-3); margin-top: 2px; }
.tools { display: grid; gap: 6px; min-width: 150px; align-content: start; }
.tool { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 10px; height: 34px; text-align: left; background: rgba(244, 236, 214, .55); }
.tool .tn { font-weight: 900; }
.tool .tc { font-family: var(--f-latin); font-size: 18px; }
.tool.on { background: var(--ink); color: var(--paper); }
.tool.on kbd { color: var(--paper); border-color: var(--paper-3); background: transparent; }
.tool.pulse { animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 4px rgba(184, 56, 30, .35); border-color: var(--fire); } }

aside.ledger { grid-column: 2; grid-row: 2 / span 2; min-width: 0; display: grid; grid-template-rows: auto auto minmax(0, 1fr); gap: 8px; min-height: 0; }
.goalbox { border: 1px solid var(--ink-3); background: rgba(244, 236, 214, .5); padding: 8px 12px; display: grid; gap: 4px; }
.goalbox .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.goalbox .big { font-size: 28px; font-weight: 600; line-height: 1; color: var(--gold); }
.goalbox .big small { font-size: 16px; color: var(--ink-2); }
.goalbox .meta { font-size: 13px; color: var(--ink-2); }
.formula { font-size: 12.5px; color: var(--ink-2); }
.formula b { color: var(--ink); }
h2 { margin: 0; font-size: 13px; letter-spacing: .3em; color: var(--ink-2); font-weight: 600; display: flex; justify-content: space-between; }
.cards { display: flex; flex-direction: column; gap: 8px; overflow: hidden; min-height: 0; }
.card { position: relative; border: 1px solid var(--ink-2); background: rgba(247, 240, 222, .82); padding: 7px 10px 8px 14px; display: grid; gap: 3px; font-size: 13px; transition: opacity .4s, transform .4s; }
.card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--c); opacity: .85; }
.card .hd { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.card .ttl { font-weight: 900; font-size: 15px; }
.card .st { font-size: 12px; color: var(--ink-3); }
.card .rws { display: grid; gap: 1px; }
.card .r { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto auto; gap: 6px; align-items: center; font-variant-numeric: tabular-nums; }
.card .r .n { color: var(--ink-3); font-family: var(--f-latin); }
.card .r .s { font-family: var(--f-latin); min-width: 56px; text-align: right; }
.card .r.half .n::after { content: " ½"; color: var(--fire); }
.card .r.hl { background: rgba(232, 195, 90, .35); }
.card .sum { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 1px 8px; border-top: 1px solid var(--ink-3); padding-top: 4px; margin-top: 2px; font-variant-numeric: tabular-nums; }
.card .sum span:nth-child(even) { font-family: var(--f-latin); text-align: right; }
.card .sum .hl { background: rgba(232, 195, 90, .35); }
.card .els { display: inline-flex; gap: 2px; vertical-align: middle; margin-left: 4px; }
.card .gold { display: flex; justify-content: space-between; align-items: baseline; border-top: 1px double var(--ink-2); padding-top: 3px; margin-top: 2px; }
.card .gold .v { font-family: var(--f-latin); font-size: 24px; color: var(--gold); }
.card .gold .v.pop { animation: goldpop .5s ease-out; }
@keyframes goldpop { 0% { transform: scale(1.5); } 100% { transform: scale(1); } }
.card.closed { opacity: .92; }
.card.mini { padding: 5px 10px 5px 14px; }
.card.mini .rws, .card.mini .sum, .card.mini .gold { display: none; }
.hist { max-height: 9.5em; overflow: hidden; }
.card .empty { color: var(--ink-3); font-style: italic; }
.hist { font-size: 12.5px; color: var(--ink-2); display: grid; gap: 2px; border-top: 1px solid var(--ink-3); padding-top: 4px; }
.hist div { display: flex; justify-content: space-between; gap: 8px; }
.hist div span:last-child { color: var(--gold); }
.elsym { width: 14px; height: 14px; display: inline-block; vertical-align: -2px; }

svg#links { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 5; }
.note { position: fixed; z-index: 15; max-width: 300px; background: #f6eed6; border: 1px solid var(--ink); padding: 8px 12px 9px; font-size: 14px; line-height: 1.55; box-shadow: 3px 3px 0 rgba(42, 28, 18, .2); pointer-events: none; transition: opacity .25s; }
.note::before { content: "師父批注"; display: block; font-size: 11px; letter-spacing: .25em; color: var(--fire); margin-bottom: 2px; }
.note b { color: var(--fire); }
.note .arr { position: absolute; width: 12px; height: 12px; background: #f6eed6; border: 1px solid var(--ink); transform: rotate(45deg); }
.toast { position: fixed; z-index: 16; left: 50%; transform: translateX(-50%); top: 64px; background: var(--ink); color: var(--paper); padding: 6px 14px; font-size: 14px; pointer-events: none; opacity: 0; transition: opacity .2s; }
.toast.show { opacity: 1; }

.overlay { position: fixed; inset: 0; background: rgba(60, 44, 28, .45); display: grid; place-items: center; padding: 16px; z-index: 30; }
.sheet { background: var(--paper); background-image: radial-gradient(ellipse at 50% 30%, #f1e7cf 0%, #e3d4b2 75%, #d2bf96 100%); border: 1px solid var(--ink); outline: 1px solid var(--ink-3); outline-offset: -7px; padding: 26px 30px; width: min(760px, 100%); max-height: calc(100% - 32px); overflow: auto; display: grid; gap: 14px; box-shadow: 6px 8px 0 rgba(42, 28, 18, .25); }
.sheet h3 { margin: 0; font-weight: 900; font-size: 26px; letter-spacing: .1em; }
.sheet h3 .lat { font-family: var(--f-sc); font-weight: 400; font-size: 18px; color: var(--ink-2); margin-left: 8px; letter-spacing: .04em; }
.sheet p { margin: 0; line-height: 1.75; max-width: 62ch; }
.sheet .muted { color: var(--ink-2); font-size: 14px; }
.sheet .hook { font-size: 20px; font-weight: 600; }
.howto { display: grid; gap: 6px; margin: 0; padding-left: 22px; line-height: 1.7; }
.shop { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.item { border: 1px solid var(--ink-2); background: rgba(250, 244, 228, .6); padding: 10px 12px; display: grid; gap: 4px; text-align: left; }
.item .tag { font-size: 11px; letter-spacing: .2em; color: var(--ink-3); }
.item .nm { font-weight: 900; font-size: 17px; }
.item .ds { font-size: 13px; color: var(--ink-2); line-height: 1.5; }
.item .pr { font-family: var(--f-latin); font-size: 18px; color: var(--gold); }
.item.bought { opacity: .35; }
.item.rare { border-color: var(--fire); }
.row-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; }
.money { font-family: var(--f-latin); font-size: 26px; color: var(--gold); }
.arc { display: flex; flex-wrap: wrap; gap: 6px; font-size: 13px; }
.arc i { font-style: normal; border: 1px solid var(--ink-3); padding: 1px 8px; background: rgba(250,244,228,.5); }
@media (prefers-reduced-motion: reduce) { .vial, .card { transition: none; } .tool.pulse, .vial.new, .card .gold .v.pop { animation: none; } }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><h1>爆鍋煉金<span class="lat">Pour Decisions</span></h1></div>
    <div class="stagebar" id="stagebar"></div>
    <div class="top-actions">
      <button id="btnSound" type="button" aria-pressed="false">音效 關</button>
      <button id="btnHelp" type="button">玩法</button>
      <button id="btnRestart" type="button">重新開始</button>
    </div>
  </header>

  <section class="stage" id="stage">
    <canvas id="view" aria-label="燒杯：選一瓶材料後在這裡按住倒出；右鍵點火柴"></canvas>
  </section>

  <section class="under">
    <div>
      <div class="hand" id="hand"></div>
      <div class="decknote" id="decknote"></div>
    </div>
    <div class="tools">
      <button class="tool" id="tMatch" type="button" title="點火：之後在燒杯上點一下（或直接右鍵）"><span><span class="tn">火柴</span> <kbd>F</kbd>/<kbd>右鍵</kbd></span><span class="tc" id="matchN">2</span></button>
      <button class="tool" id="tLid" type="button" title="蓋上蓋子：氣體累積壓力，滿了就爆蓋"><span><span class="tn">蓋子</span> <kbd>空白鍵</kbd></span><span class="tc" id="lidState">開</span></button>
      <button class="tool" id="tSeal" type="button" title="立刻結算所有帳本，結束這一回合"><span><span class="tn">封瓶</span> <kbd>Enter</kbd></span><span class="tc">⊗</span></button>
    </div>
  </section>

  <aside class="ledger">
    <div class="goalbox">
      <div class="row"><span class="big" id="goldNow">0<small> / 0 金</small></span><span class="meta" id="poursLeft"></span></div>
      <div class="formula">每一倒開一本帳：<b>物質</b>（反應×點數）× <b>元素</b>（1＋點亮的火水土氣＋連鎖）× <b>秘方</b>。</div>
    </div>
    <h2><span>帳本</span><span id="arcN"></span></h2>
    <div class="cards" id="cards"></div>
  </aside>
</div>
<svg id="links" aria-hidden="true"></svg>
<div class="note" id="note" hidden><span id="noteText"></span><i class="arr" id="noteArr"></i></div>
<div class="toast" id="toast"></div>
<div class="overlay" id="overlay" hidden></div>

let WASH_BLUR = !QS.has("noblur");
const fx = { floats: [], buckets: new Map(), chains: [], gold: [], lidFly: null, shake: 0 };
const meta = new Map(); // ledger uid -> UI meta

function hex(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }

// ---------------- game flow ----------------
function newGame(seed) {
  G = { seed: seed || ((Math.random() * 1e9) | 0), round: 0, money: 4, deck: START_DECK.slice(), arc: [],
        draw: [], hand: [], disc: [], sel: -1, matchMode: false, aimX: 80, hoverY: -1, hover: false, pourP: null,
        holding: false, shopItems: [], reroll: 1, displayGold: 0, ended: false, tut: { step: 0, done: {} }, lidUsed: false, frame0: 0 };
  G.rng = mulberry32(G.seed);
  startRound();
}
function mods() { const o = {}; for (const c of G.arc) o[c] = true; return o; }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = (G.rng() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }
function startRound() {
  const md = mods();
  R = createRound({ seed: G.seed + G.round * 101, mods: md, pours: BASE_POURS + (md.spare ? 1 : 0), matches: BASE_MATCHES + (md.matchbox ? 1 : 0),
                    target: TARGETS[G.round], lidMax: md.thickglass ? 1540 : 1100 });
  R.onOpen = onOpen; R.onClose = onClose; R.onRx = onRx;
  R.S.onLidPop = onLidPop;
  if (G.round === 0) { G.hand = FIRST_HAND.slice(); G.draw = FIRST_DRAW.slice().reverse(); G.disc = []; }
  else { G.draw = shuffle(G.deck.slice()); G.hand = []; G.disc = []; while (G.hand.length < HAND && G.draw.length) G.hand.push(G.draw.pop()); }
  G.sel = -1; G.matchMode = false; G.pourP = null; G.displayGold = 0; G.ended = false; G.newIdx = -1;
  fx.floats = []; fx.buckets.clear(); fx.chains = []; fx.gold = []; fx.lidFly = null;
  meta.clear();
  document.getElementById("cards").innerHTML = `<div class="card mini placeholder" style="--c:#a8957a"><div class="hd"><span class="st">每倒一瓶、每點一根火柴，這裡就開一本帳，記下它引起的每個反應。</span></div></div>`;
  buildBg();
  renderHand(); renderSide();
}

// ---------------- ledger callbacks ----------------
function ledgerColor(Lg) { return Lg.kind === "pour" ? VIALS[Lg.m].c : Lg.kind === "match" ? "#b8381e" : "#8a7458"; }
function ledgerTitle(Lg) {
  if (Lg.kind === "pour") return `第 ${G.pourCount[Lg.id]} 倒・${VIALS[Lg.m].nm}`;
  if (Lg.kind === "match") return "火柴";
  return "餘波";
}
function onOpen(Lg) {
  if (!G.pourCount) G.pourCount = {};
  if (Lg.kind === "pour") { G.pourIdx = (G.pourIdx || 0) + 1; G.pourCount[Lg.id] = BASE_POURS + (mods().spare ? 1 : 0) - R.pours; }
  const m = { el: null, sx: 0, sy: 0, sn: 0, genPos: [], lastRender: 0, closing: 0, gone: false };
  meta.set(Lg.uid, m);
  const el = document.createElement("div");
  el.className = "card"; el.style.setProperty("--c", ledgerColor(Lg));
  el.innerHTML = `<div class="hd"><span class="ttl">${ledgerTitle(Lg)}</span><span class="st">${Lg.kind === "pour" ? "倒料中…" : "反應中…"}</span></div><div class="rws"><div class="empty">還沒有反應</div></div><div class="sum"></div><div class="gold"><span>金</span><span class="v">—</span></div>`;
  m.el = el;
  const cards = document.getElementById("cards");
  const ph = cards.querySelector(".placeholder"); if (ph) ph.remove();
  cards.insertBefore(el, cards.firstChild);
  trimCards();
}
function trimCards(minisToHist) {
  const cards = document.getElementById("cards");
  if (minisToHist) for (const c of [...cards.querySelectorAll(".card.mini")]) { if (!c.querySelector(".st").textContent.startsWith("已佈置") && !c.querySelector(".st").textContent.startsWith("什麼")) continue; moveToHist(cards, c); }
  // keep at most 3 full cards; older ones collapse into the history list
  const full = [...cards.querySelectorAll(".card")];
  let hist = cards.querySelector(".hist");
  for (let i = 3; i < full.length; i++) {
    const c = full[i];
    moveToHist(cards, c);
  }
}
function moveToHist(cards, c) {
  let hist = cards.querySelector(".hist");
  if (!hist) { hist = document.createElement("div"); hist.className = "hist"; cards.appendChild(hist); }
  const t = c.querySelector(".ttl").textContent, v = c.querySelector(".gold .v").textContent;
  const d = document.createElement("div"); d.innerHTML = `<span>${t}${c.classList.contains("mini") ? (t === "火柴" ? "（落空）" : "（佈置）") : ""}</span><span>${v === "—" ? "…" : v}</span>`;
  hist.insertBefore(d, hist.firstChild);
  c.remove();
}
function onRx(Lg, type, p, g) {
  const m = meta.get(Lg.uid);
  const x = p % W, y = (p / W) | 0;
  m.sx += x; m.sy += y; m.sn++;
  // chain positions per generation
  const gp = m.genPos[g] || (m.genPos[g] = { x: 0, y: 0, n: 0, t: performance.now() });
  gp.x += x; gp.y += y; gp.n++;
  if (gp.n === 1 && g >= 2 && m.genPos[g - 1] && Math.hypot(m.genPos[g - 1].x / m.genPos[g - 1].n - x, m.genPos[g - 1].y / m.genPos[g - 1].n - y) < 55) {
    const pp = m.genPos[g - 1];
    fx.chains.push({ uid: Lg.uid, g, from: [pp.x / pp.n, pp.y / pp.n], toRef: gp, born: performance.now() });
    if (fx.chains.length > 8) fx.chains.shift();
  }
  // aggregated floating text: ledger × type × 16×16 block, 0.5 s
  let b = null;
  for (const bb of fx.buckets.values()) {
    if (bb.uid !== Lg.uid || bb.type !== type) continue;
    const dx = bb.x / bb.n - x, dy = bb.y / bb.n - y;
    if (dx * dx + dy * dy < 26 * 26 || fx.buckets.size + fx.floats.length >= 12) { b = bb; break; }
  }
  if (!b) { b = { uid: Lg.uid, type, n: 0, x: 0, y: 0, t0: performance.now() }; fx.buckets.set(fx.bucketId = (fx.bucketId || 0) + 1, b); }
  b.n++; b.x += x; b.y += y;
  if (type === "blast" || type === "lidpop") fx.shake = Math.min(10, fx.shake + (type === "lidpop" ? 1.5 : 0.6));
  sfx(type);
}
function flushBuckets(now) {
  for (const [k, b] of fx.buckets) {
    if (now - b.t0 < 500) continue;
    fx.buckets.delete(k);
    if (b.n < 4 && fx.floats.length >= 4 && b.type !== "lidpop") continue;
    const pts = ptsOf(b.type, R.mods);
    const text = `${RXINFO[b.type]} ×${b.n}  +${fmt(b.n * pts)}`;
    // de-overlap against live floats (in cell units; a float is ~text.length*1.6 cells wide, 5 tall)
    const fw = text.length * 2.3, fh = 6;
    let fx0 = b.x / b.n, fy0 = b.y / b.n;
    let placed = false;
    for (let tries = 0; tries < 8; tries++) {
      let hit = false;
      for (const o of fx.floats) {
        const oy = o.y - (now - o.born) / 1000 * 34 / L.cp;
        if (Math.abs(o.x - fx0) < (fw + o.w) / 2 && Math.abs(oy - fy0) < fh) { hit = true; break; }
      }
      if (!hit) { placed = true; break; }
      fy0 -= fh;
    }
    if (!placed && b.type !== "lidpop" && b.type !== "blast") continue; // the ledger card still has it
    fx.floats.push({ text, w: fw, el: RX[b.type].el[0], x: Math.max(fw / 2, Math.min(W - fw / 2, fx0)), y: Math.max(16, fy0), born: now, big: b.type === "lidpop" || b.type === "blast" });
  }
  while (fx.floats.length > 12) fx.floats.shift();
}
function onClose(Lg) {
  const m = meta.get(Lg.uid);
  m.closing = performance.now();
  renderCard(Lg, true);
  tally(Lg, m);
}
function onLidPop(gasN) {
  fx.lidFly = { born: performance.now(), vx: (R.S.rnd() - 0.5) * 6 };
  fx.shake = 12;
  toast(`爆蓋！${gasN} 格氣體一次炸開`);
  G.tut.done.pop = true;
  sfx("lidpop", true);
}

// Balatro-ish settlement: rows light up in calculation order, then gold flows to the receiver.
function tally(Lg, m) {
  const el = m.el, res = Lg.result;
  el.querySelector(".st").textContent = Lg.why === "forced" ? "第 4 本帳：提前結算" : "結算";
  if (res.gold === 0) {
    el.classList.add("mini", "closed");
    el.querySelector(".gold .v").textContent = "0";
    el.querySelector(".st").textContent = Lg.kind === "pour" ? "已佈置：之後被點燃，記在點火那本帳" : Lg.kind === "match" ? "什麼也沒點著" : "";
    setTimeout(() => { if (el.isConnected) { const cards = document.getElementById("cards"); const full = [...cards.querySelectorAll(".card")]; if (full.indexOf(el) >= 0 && full.length > 1) { cards.appendChild(el); trimCards(true); } } }, 2500);
    return;
  }
  const rows = [...el.querySelectorAll(".r"), ...el.querySelectorAll(".sum > span:nth-child(odd)")];
  let i = 0;
  const step = () => {
    rows.forEach(r => r.classList.remove("hl"));
    if (i < rows.length) {
      rows[i].classList.add("hl"); const sib = rows[i].nextElementSibling; if (sib && rows[i].parentElement.classList.contains("sum")) sib.classList.add("hl");
      i++; setTimeout(() => { if (sib) sib.classList.remove("hl"); step(); }, 90);
    } else {
      const v = el.querySelector(".gold .v");
      v.textContent = res.gold > 0 ? "+" + fmt(res.gold) : "0";
      v.classList.remove("pop"); void v.offsetWidth; v.classList.add("pop");
      el.querySelector(".st").textContent = res.gold > 0 ? "金砂流入受器 ⟶" : "沒有反應";
      el.classList.add("closed");
      spawnGold(Lg, m, res.gold);
      if (res.gold > 0) sfx("gold", true);
    }
  };
  step();
}
function spawnGold(Lg, m, gold) {
  if (gold <= 0) return;
  const k = Math.max(6, Math.min(48, Math.round(gold / (R.target / 30))));
  const cx = m.sn ? m.sx / m.sn : (Lg.x || 80), cy = m.sn ? m.sy / m.sn : 60;
  const now = performance.now();
  for (let i = 0; i < k; i++) fx.gold.push({ x0: cx + (Math.random() - 0.5) * 10, y0: cy + (Math.random() - 0.5) * 8, born: now + i * 28, v: gold / k, done: false, dur: 900 + Math.random() * 250 });
}

// ---------------- input ----------------
function cellFromEvent(e) {
  const r = canvas.getBoundingClientRect();
  const px = (e.clientX - r.left), py = (e.clientY - r.top);
  const x = Math.floor((px - L.bx) / L.cp), y = Math.floor((py - L.by) / L.cp);
  return { x, y, inside: x >= 1 && x < W - 1 && y >= -12 && y < H - 1 };
}
canvas.addEventListener("contextmenu", e => e.preventDefault());
canvas.addEventListener("pointermove", e => {
  const c = cellFromEvent(e);
  G.hover = c.inside; G.aimX = Math.max(5, Math.min(W - 6, c.x)); G.hoverY = c.y;
  if (G.pourP && G.holding) R.aim(G.pourP, G.aimX);
});
canvas.addEventListener("pointerleave", () => { G.hover = false; });
canvas.addEventListener("pointerdown", e => {
  if (G.ended) return;
  ensureAudio();
  const c = cellFromEvent(e);
  if (!c.inside) return;
  if (e.button === 2 || G.matchMode) { strikeAt(c.x, Math.max(0, c.y)); return; }
  if (G.sel < 0) { toast(G.hand.length ? "先在下方選一瓶材料（或按 1–4）" : "手上沒有材料了"); return; }
  if (R.S.lid) { toast("蓋子蓋著不能倒料：按空白鍵打開"); pulse("tLid"); return; }
  if (R.pours <= 0) { toast("這回合的倒料用完了"); return; }
  canvas.setPointerCapture(e.pointerId);
  G.aimX = Math.max(5, Math.min(W - 6, c.x));
  const mat = G.hand[G.sel];
  const P = R.startPour(mat, G.aimX);
  if (!P) return;
  G.pourP = P; G.holding = true;
  G.disc.push(G.hand.splice(G.sel, 1)[0]);
  if (G.draw.length === 0 && G.disc.length && G.round > 0) G.draw = shuffle(G.disc.splice(0));
  if (G.draw.length) { G.hand.splice(G.sel, 0, G.draw.pop()); G.newIdx = G.sel; } else G.newIdx = -1;
  G.sel = -1;
  G.tut.done.pour = (G.tut.done.pour || 0) + 1;
  if (mat === M.SULFUR) G.tut.done.sulfur = true;
  renderHand(); renderSide();
});
const release = () => { G.holding = false; };
canvas.addEventListener("pointerup", release); canvas.addEventListener("pointercancel", release);

function strikeAt(x, y) {
  if (R.matches <= 0) { toast("火柴用完了"); G.matchMode = false; renderSide(); return; }
  R.strike(Math.max(2, Math.min(W - 3, x)), Math.max(1, Math.min(H - 3, y)));
  G.matchMode = false; G.tut.done.match = true;
  sfx("match", true);
  renderSide();
}
function toggleLid() {
  if (G.ended) return;
  R.toggleLid(); G.lidUsed = true; G.tut.done.lid = true;
  if (R.S.lid) sfx("lid", true);
  renderSide();
}
function seal() {
  if (G.ended) return;
  R.closeAll(); renderSide();
}
function selectVial(i) {
  if (i >= G.hand.length) return;
  G.sel = G.sel === i ? -1 : i; G.matchMode = false; renderHand(); renderSide();
}
document.getElementById("tMatch").addEventListener("click", () => { if (R.matches > 0) { G.matchMode = !G.matchMode; G.sel = -1; renderHand(); renderSide(); } else toast("火柴用完了"); });
document.getElementById("tLid").addEventListener("click", toggleLid);
document.getElementById("tSeal").addEventListener("click", seal);
window.addEventListener("keydown", e => {
  if (!document.getElementById("overlay").hidden) { if (e.key === "Enter") { const b = document.querySelector("#overlay .primary"); if (b) { e.preventDefault(); b.click(); } } return; }
  if (e.key >= "1" && e.key <= "4") selectVial(+e.key - 1);
  else if (e.key === "f" || e.key === "F") document.getElementById("tMatch").click();
  else if (e.key === " ") { e.preventDefault(); toggleLid(); }
  else if (e.key === "Enter") { e.preventDefault(); seal(); }
  else if (e.key === "Escape") { G.sel = -1; G.matchMode = false; renderHand(); renderSide(); }
  else if (e.key === "Shift") speedHeld = true;
});
window.addEventListener("keyup", e => { if (e.key === "Shift") speedHeld = false; });

// ---------------- side UI ----------------
const elHand = document.getElementById("hand");
function vialIcon(m) {
  const c = document.createElement("canvas"); c.width = 34; c.height = 60;
  const g = c.getContext("2d");
  const col = VIALS[m].c;
  g.strokeStyle = "#2a1c12"; g.lineWidth = 1.2; g.fillStyle = col;
  // flask silhouette
  g.beginPath(); g.moveTo(13, 4); g.lineTo(21, 4); g.lineTo(21, 22); g.quadraticCurveTo(32, 32, 31, 46); g.quadraticCurveTo(30, 57, 17, 57);
  g.quadraticCurveTo(4, 57, 3, 46); g.quadraticCurveTo(2, 32, 13, 22); g.closePath();
  g.save(); g.clip();
  g.globalAlpha = 0.75; g.fillRect(0, 30, 34, 30); g.globalAlpha = 1;
  g.strokeStyle = "rgba(42,28,18,.7)"; g.lineWidth = 0.8;
  for (let y = 32; y < 60; y += 3) { g.beginPath(); g.moveTo(0, y); g.lineTo(34, y); g.stroke(); }
  g.restore();
  g.strokeStyle = "#2a1c12"; g.lineWidth = 1.2;
  g.beginPath(); g.moveTo(13, 4); g.lineTo(21, 4); g.lineTo(21, 22); g.quadraticCurveTo(32, 32, 31, 46); g.quadraticCurveTo(30, 57, 17, 57);
  g.quadraticCurveTo(4, 57, 3, 46); g.quadraticCurveTo(2, 32, 13, 22); g.closePath(); g.stroke();
  g.fillStyle = "#6b4a2a"; g.fillRect(12, 1, 10, 5); g.strokeRect(12, 1, 10, 5);
  return c;
}
function renderHand() {
  elHand.innerHTML = "";
  for (let i = 0; i < HAND; i++) {
    const m = G.hand[i];
    if (m === undefined) { const d = document.createElement("div"); d.className = "vial empty"; d.textContent = "空"; elHand.appendChild(d); continue; }
    const v = VIALS[m];
    const b = document.createElement("button");
    b.type = "button"; b.className = "vial" + (G.sel === i ? " sel" : "") + (G.newIdx === i ? " new" : "");
    b.disabled = R.pours <= 0 || G.ended;
    b.appendChild(vialIcon(m));
    const nm = document.createElement("div"); nm.className = "nm"; nm.innerHTML = `${v.nm}<kbd class="k">${i + 1}</kbd>`;
    const ds = document.createElement("div"); ds.className = "ds"; ds.textContent = v.ds;
    b.appendChild(nm); b.appendChild(ds);
    b.addEventListener("click", () => selectVial(i));
    elHand.appendChild(b);
  }
  G.newIdx = -1;
  document.getElementById("decknote").textContent = `牌組 ${G.deck.length} 瓶 · 抽牌堆 ${G.draw.length} · 倒過的瓶子回合結束後洗回`;
}
function renderSide() {
  const st = STAGES[Math.floor(G.round / 3)];
  document.getElementById("stagebar").innerHTML = `<b>${st.nm}</b><span class="lat">${st.lat}</span><span>第 ${G.round % 3 + 1} / 3 回合 · 大業 ${G.round + 1} / 12</span>`;
  document.getElementById("goldNow").innerHTML = `${fmt(G.displayGold)}<small> / ${fmt(R.target)} 金</small>`;
  document.getElementById("poursLeft").innerHTML = `倒料 <b>${R.pours}</b> · 火柴 <b>${R.matches}</b> · $${G.money}`;
  document.getElementById("matchN").textContent = "|".repeat(R.matches) || "0";
  const tm = document.getElementById("tMatch"); tm.classList.toggle("on", G.matchMode); tm.disabled = R.matches <= 0 || G.ended;
  const tl = document.getElementById("tLid"); tl.classList.toggle("on", R.S.lid); document.getElementById("lidState").textContent = R.S.lid ? "蓋" : "開";
  document.getElementById("arcN").textContent = G.arc.length ? "秘方 " + G.arc.map(id => ARCANA.find(a => a.id === id).nm).join("・") : "";
  [...elHand.children].forEach((b, i) => { if (b.tagName === "BUTTON") b.disabled = R.pours <= 0 || G.ended; });
}
function elSvg(e, on) {
  const c = on ? ELC[e] : "#a8957a";
  const up = e === 0 || e === 3, bar = e >= 2;
  const tri = up ? "M7 1.5 L13 12.5 L1 12.5 Z" : "M1 1.5 L13 1.5 L7 12.5 Z";
  const ln = bar ? (up ? `<line x1="3" y1="8.5" x2="11" y2="8.5" stroke="${on ? "#2a1c12" : c}" stroke-width="1.2"/>` : `<line x1="3" y1="5.5" x2="11" y2="5.5" stroke="${on ? "#2a1c12" : c}" stroke-width="1.2"/>`) : "";
  return `<svg class="elsym" viewBox="0 0 14 14"><path d="${tri}" fill="${on ? c : "none"}" fill-opacity=".8" stroke="${on ? "#2a1c12" : c}" stroke-width="1.2"/>${ln}</svg>`;
}
function renderCard(Lg, final) {
  const m = meta.get(Lg.uid); if (!m || !m.el) return;
  const res = scoreLedger(Lg, R.mods);
  const rws = m.el.querySelector(".rws");
  if (!res.rows.length) rws.innerHTML = `<div class="empty">${Lg.kind === "pour" ? "還沒有反應——它會等你點燃或倒入對頭" : "還沒有反應"}</div>`;
  else rws.innerHTML = res.rows.map(r => `<div class="r${r.halved ? " half" : ""}">${elSvg(RX[r.type].el[0], true)}<span>${RXINFO[r.type]}</span><span class="n">×${r.n}×${r.pts}</span><span class="s">${fmt(r.sub)}</span></div>`).join("");
  const els = [0, 1, 2, 3].map(e => elSvg(e, res.lit[e])).join("");
  let sum = "";
  if (res.rows.length) {
    if (res.stale) sum += `<span>佈置（碰到 2 倒以前的陳料）</span><span>+${fmt(res.stale)}</span>`;
    sum += `<span>物質</span><span>${fmt(res.matter)}</span>`;
    sum += `<span>元素 1＋${res.nLit}<span class="els">${els}</span>${res.chain ? `＋連鎖 ${res.chain}` : ""}${res.four ? "＋四象 2" : ""}${res.elemMods ? `＋秘方 ${res.elemMods}` : ""}</span><span>×${res.elem}</span>`;
    for (const a of res.arcana) sum += `<span>秘方・${ARCANA.find(x => x.id === a.id).nm}</span><span>×${a.x}</span>`;
  }
  m.el.querySelector(".sum").innerHTML = sum;
  if (!final) {
    const v = m.el.querySelector(".gold .v"); v.textContent = res.gold > 0 ? "≈" + fmt(res.gold) : "—";
    const pouring = R.active.some(P => P.L === Lg);
    m.el.querySelector(".st").textContent = pouring ? "倒料中…" : res.rows.length ? "反應中…" : "等待中…";
  }
}
let toastT = 0;
function toast(t) { const el = document.getElementById("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("show"), 1800); }
function pulse(id) { const b = document.getElementById(id); b.classList.remove("pulse"); void b.offsetWidth; b.classList.add("pulse"); setTimeout(() => b.classList.remove("pulse"), 2400); }
function fmt(n) { n = Math.round(n); return n >= 1e7 ? (n / 1e6).toFixed(1) + "M" : n.toLocaleString("en-US"); }

// ---------------- tutorial notes (round 1, then only when relevant) ----------------
function setNote(text, anchorEl, side) {
  const n = document.getElementById("note");
  if (!text) { n.hidden = true; G.noteKey = null; return; }
  if (G.noteKey !== text) { document.getElementById("noteText").innerHTML = text; G.noteKey = text; }
  n.hidden = false;

  const st = STAGES[Math.floor(G.round / 3)];
  const items = G.shopItems.map((it, i) => {
    const bought = it.bought ? " bought" : "";
    if (it.kind === "vial") { const v = VIALS[it.m]; return `<button type="button" class="item${bought}" data-i="${i}" ${it.bought ? "disabled" : ""}><span class="tag">材料瓶・加入牌組</span><span class="nm">${v.nm}</span><span class="ds">${v.ds}</span><span class="pr">$${it.price}</span></button>`; }
    return `<button type="button" class="item${bought}${it.c.rare ? " rare" : ""}" data-i="${i}" ${it.bought ? "disabled" : ""}><span class="tag">秘方・永久效果</span><span class="nm">${it.c.nm}</span><span class="ds">${it.c.ds}</span><span class="pr">$${it.price}</span></button>`;
  }).join("");
  showOverlay(`
    <h3>藥鋪<span class="lat">Officina</span></h3>
    <p class="muted" id="shopMsg">${msg}</p>
    <div class="row-actions"><span class="money">$${G.money}</span><button type="button" id="reroll">換一批貨 $${G.reroll}</button></div>
    <div class="shop">${items}</div>
    <div class="arc">${G.arc.length ? G.arc.map(id => `<i>${ARCANA.find(a => a.id === id).nm}</i>`).join("") : '<span class="muted">秘方槽 0 / 5</span>'}</div>
    <div class="row-actions"><span class="muted">下一回合：${st.nm} 第 ${G.round % 3 + 1} 回合 · 金線 ${fmt(TARGETS[G.round])}</span><button type="button" class="primary" id="next">開始下一回合 <kbd>Enter</kbd></button></div>`);
  ov.querySelectorAll(".item").forEach(b => b.addEventListener("click", () => buy(+b.dataset.i)));
  document.getElementById("reroll").addEventListener("click", () => {
    if (G.money < G.reroll) { flashMsg("錢不夠"); return; }
    G.money -= G.reroll; G.reroll++; rollShop(); showShop("換了一批貨。");
  });
  document.getElementById("next").addEventListener("click", () => { hideOverlay(); startRound(); });
}
function flashMsg(t) { const m = document.getElementById("shopMsg"); if (m) m.textContent = t; }
function buy(i) {
  const it = G.shopItems[i]; if (!it || it.bought) return;
  if (G.money < it.price) { flashMsg("錢不夠"); return; }
  if (it.kind === "arc" && G.arc.length >= MAX_ARC) { flashMsg("秘方最多 5 個"); return; }
  G.money -= it.price; it.bought = true;
  if (it.kind === "vial") G.deck.push(it.m); else G.arc.push(it.c.id);
  showShop(it.kind === "vial" ? `已把「${VIALS[it.m].nm}」加入牌組。` : `已習得秘方「${it.c.nm}」。`);
}
function gameOver() {
  const best = R.closedLog.reduce((a, b) => (b.result.gold > (a ? a.result.gold : -1) ? b : a), null);
  showOverlay(`<h3>大業中斷<span class="lat">Opus interruptum</span></h3>
    <p>${STAGES[Math.floor(G.round / 3)].nm}第 ${G.round % 3 + 1} 回合：煉出 ${fmt(R.gold)} 金，金線是 ${fmt(TARGETS[G.round])}。</p>
    ${best && best.result.gold > 0 ? `<p class="muted">最好的一本帳是「${ledgerTitle(best)}」+${fmt(best.result.gold)}，點亮了 ${best.result.nLit} 個元素。</p>` : ""}
    <p class="muted">提示：先鋪可燃物（硫磺浮在水上、油浮在最上層），再用火柴點燃；一本帳點亮越多元素，倍率越高。</p>
    <div class="row-actions"><span></span><button type="button" class="primary" id="again">重新開始大業 <kbd>Enter</kbd></button></div>`);
  document.getElementById("again").addEventListener("click", () => { hideOverlay(); newGame(); });
}
function victory() {
  showOverlay(`<h3>大業已成<span class="lat">Opus magnum</span></h3><p>十二回合全部過關。最後一回合煉出 ${fmt(R.gold)} 金。</p>
    <div class="row-actions"><span></span><button type="button" class="primary" id="again">再煉一次</button></div>`);
  document.getElementById("again").addEventListener("click", () => { hideOverlay(); newGame(); });
}
function showHelp(first) {
  showOverlay(`<h3>爆鍋煉金<span class="lat">Pour Decisions</span></h3>
    ${first ? `<p class="hook">把一杯泥巴煉成黃金——用真的會燒、會凝、會爆的物質。</p>` : ""}
    <ol class="howto">
      <li><b>倒</b>：選一瓶材料，在燒杯上按住倒出。不用等——上一瓶還在流，就能倒下一瓶。</li>
      <li><b>點</b>：<b>火柴</b>（<kbd>F</kbd> 或右鍵）點燃你鋪好的硫磺、油；<b>蓋子</b>（<kbd>空白鍵</kbd>）困住氣體，壓力滿了就爆蓋。</li>
      <li><b>算</b>：每一倒、每根火柴開一本帳。金＝物質 × 元素（1＋點亮的火水土氣＋連鎖）× 秘方。</li>
      <li><b>煉</b>：結算的金砂流進受器，滿過<b>金線</b>就過關，到藥鋪添購材料與秘方。</li>
    </ol>
    <p class="muted">原型 v0.2：畫面、音效、數值都是暫定。第一回合的手牌是固定的教學手牌。</p>
    <div class="row-actions"><span></span><button type="button" class="primary" id="go">${first ? "開始大業" : "繼續"} <kbd>Enter</kbd></button></div>`);
  document.getElementById("go").addEventListener("click", hideOverlay);
}
document.getElementById("btnSound").addEventListener("click", e => {
  ensureAudio(); soundOn = !soundOn;
  e.currentTarget.textContent = soundOn ? "音效 開" : "音效 關";
  e.currentTarget.setAttribute("aria-pressed", String(soundOn));
});
document.getElementById("btnHelp").addEventListener("click", () => showHelp(false));
document.getElementById("btnRestart").addEventListener("click", () => { hideOverlay(); newGame(); });
window.addEventListener("resize", () => { computeLayout(); });
window.addEventListener("scroll", () => { if (G) buildBg(); });

computeLayout();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { computeLayout(); });
newGame(+(new URLSearchParams(location.search).get("seed")) || 0);
if (!new URLSearchParams(location.search).has("skipintro")) showHelp(true);
requestAnimationFrame(loop);
window.__game = { get G() { return G; }, get R() { return R; }, get L() { return L; }, M, VIALS };
})();
</script>
</body>
</html>

<title>Pour Decisions 原型</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Noto+Sans+TC:wght@400;700&display=swap">
<style>
/* Layout: night chemistry bench — beaker (stage) left, lab readout right, hand of vials below the beaker. Single dark look by choice. */
:root {
  color-scheme: dark;
  --bg: #1b1520;
  --bench: #2e222f;
  --panel: #3e3546;
  --line: #625565;
  --fg: #e6ecdf;
  --dim: #9babb2;
  --chips: #4d9be6;
  --mult: #e83b3b;
  --gold: #f9c22b;
  --good: #1ebc73;
  --f-display: "Silkscreen", ui-monospace, "Courier New", monospace;
  --f-body: "Noto Sans TC", system-ui, "Microsoft JhengHei", "PingFang TC", sans-serif;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); }
#app {
  max-width: 1120px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 24px;
  display: grid; gap: 16px;
  grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr);
}
@media (max-width: 820px) { #app { grid-template-columns: minmax(0, 1fr); } }
header.top { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(20px, 3vw, 28px); letter-spacing: .04em; margin: 0; color: var(--gold); }
h1 small { font-family: var(--f-body); font-weight: 400; font-size: 13px; color: var(--dim); letter-spacing: 0; margin-left: 8px; }
.top-actions { display: flex; gap: 8px; }
button { font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 14px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--dim); }
button:focus-visible, .card:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
button:disabled { opacity: .45; cursor: not-allowed; }
button.primary { background: var(--gold); color: #2e222f; border-color: var(--gold); font-weight: 700; }

.stage { display: grid; gap: 12px; min-width: 0; }
.beaker-wrap { position: relative; background: var(--bench); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
canvas#view { display: block; width: 100%; aspect-ratio: 5 / 4; image-rendering: pixelated; border-radius: 4px; touch-action: none; cursor: crosshair; background: #2e222f; }
.beaker-hint { position: absolute; left: 50%; top: 18px; transform: translateX(-50%); font-size: 13px; color: var(--dim); pointer-events: none; text-align: center; background: rgba(27,21,32,.7); padding: 4px 10px; border-radius: 4px; }
.popup { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%) scale(.6); opacity: 0; font-family: var(--f-display); font-size: clamp(22px, 4vw, 40px); font-weight: 700; color: var(--gold); text-shadow: 0 2px 0 #2e222f, 0 0 18px rgba(249,194,43,.5); pointer-events: none; transition: transform .35s cubic-bezier(.2,1.6,.4,1), opacity .2s; white-space: nowrap; }
.popup.show { transform: translate(-50%, -50%) scale(1); opacity: 1; }

.hand { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.card { background: var(--panel); border: 2px solid var(--line); border-radius: 8px; padding: 10px; text-align: left; display: grid; gap: 6px; align-content: start; min-height: 128px; transition: transform .12s, border-color .12s; }
.card:hover:not(:disabled) { transform: translateY(-3px); }
.card.sel { border-color: var(--gold); transform: translateY(-6px); box-shadow: 0 6px 0 rgba(0,0,0,.3); }
.card .sw { height: 28px; border-radius: 4px; }
.card .nm { font-weight: 700; font-size: 16px; }
.card .ds { font-size: 12px; color: var(--dim); line-height: 1.45; }
@media (max-width: 520px) { .hand { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

aside.readout { display: grid; gap: 12px; align-content: start; min-width: 0; }
.box { background: var(--bench); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 10px; }
.box h2 { margin: 0; font-size: 12px; letter-spacing: .12em; color: var(--dim); font-weight: 700; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { display: grid; gap: 2px; }
.stat .k { font-size: 12px; color: var(--dim); }
.stat .v { font-family: var(--f-display); font-size: 22px; font-variant-numeric: tabular-nums; }
.progress { height: 10px; background: #2a2030; border-radius: 5px; overflow: hidden; border: 1px solid var(--line); }
.progress > i { display: block; height: 100%; width: 0; background: var(--gold); transition: width .4s; }
.calc { display: flex; align-items: stretch; gap: 8px; font-family: var(--f-display); font-variant-numeric: tabular-nums; }
.calc .chips, .calc .mult { flex: 1; text-align: center; border-radius: 6px; padding: 8px 4px; font-size: 26px; font-weight: 700; color: #fff; }
.calc .chips { background: var(--chips); }
.calc .mult { background: var(--mult); }
.calc .x { align-self: center; font-size: 22px; color: var(--dim); }
.bump { animation: bump .25s; }
@keyframes bump { 50% { transform: scale(1.12); } }
.rx { display: grid; gap: 4px; font-size: 13px; max-height: 210px; overflow: auto; }
.rx .row { display: grid; grid-template-columns: 12px 1fr auto auto; gap: 8px; align-items: center; }
.rx .dot { width: 10px; height: 10px; border-radius: 2px; }
.rx .n { font-variant-numeric: tabular-nums; color: var(--dim); }
.rx .p { font-variant-numeric: tabular-nums; color: var(--chips); min-width: 48px; text-align: right; }
.rx .empty { color: var(--dim); }
.cats { display: grid; gap: 6px; }
.cat { font-size: 13px; padding: 8px 10px; background: var(--panel); border-radius: 6px; border-left: 3px solid var(--gold); }
.cat b { display: block; font-size: 14px; }
.cat span { color: var(--dim); }
.deck { font-size: 13px; color: var(--dim); display: flex; flex-wrap: wrap; gap: 6px; }
.deck i { font-style: normal; display: inline-flex; align-items: center; gap: 4px; background: var(--panel); padding: 2px 8px; border-radius: 10px; }
.deck i::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--c); }

.overlay { position: fixed; inset: 0; background: rgba(15,11,18,.82); display: grid; place-items: center; padding: 16px; z-index: 20; }
.sheet { background: var(--bench); border: 1px solid var(--line); border-radius: 12px; padding: 22px; width: min(720px, 100%); max-height: calc(100% - 32px); overflow: auto; display: grid; gap: 16px; }
.sheet h3 { margin: 0; font-family: var(--f-display); font-size: 24px; color: var(--gold); }
.sheet p { margin: 0; line-height: 1.7; color: var(--fg); max-width: 62ch; }
.sheet .muted { color: var(--dim); font-size: 13px; }
.shop { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 520px) { .shop { grid-template-columns: minmax(0,1fr); } }
.item { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: grid; gap: 6px; text-align: left; }
.item .tag { font-size: 11px; letter-spacing: .1em; color: var(--dim); }
.item .nm { font-weight: 700; }
.item .ds { font-size: 13px; color: var(--dim); line-height: 1.5; }
.item .pr { font-family: var(--f-display); color: var(--gold); }
.item.bought { opacity: .35; }
.row-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; }
.money { font-family: var(--f-display); font-size: 22px; color: var(--gold); }
.howto { display: grid; gap: 8px; margin: 0; padding-left: 20px; line-height: 1.7; }
@media (prefers-reduced-motion: reduce) { .card, .popup, .progress > i { transition: none; } .bump { animation: none; } }
</style>

<div id="app">
  <header class="top">
    <h1>POUR DECISIONS<small>落沙煉金 原型 v0.1</small></h1>
    <div class="top-actions">
      <button id="btnSound" type="button" aria-pressed="false">音效：關</button>
      <button id="btnHelp" type="button">玩法</button>
      <button id="btnRestart" type="button">重新開始</button>
    </div>
  </header>

  <section class="stage">
    <div class="beaker-wrap">
      <canvas id="view" width="640" height="512" aria-label="燒杯：在這裡按住倒料"></canvas>
      <div class="beaker-hint" id="hint">先選一瓶材料，再在燒杯上按住倒料</div>
      <div class="popup" id="popup"></div>
    </div>
    <div class="hand" id="hand"></div>
  </section>

  <aside class="readout">
    <div class="box">
      <h2>第 <span id="roundNo">1</span> / 8 回合</h2>
      <div class="stats">
        <div class="stat"><span class="k">目標</span><span class="v" id="target">0</span></div>
        <div class="stat"><span class="k">本回合得分</span><span class="v" id="score">0</span></div>
        <div class="stat"><span class="k">剩餘倒料</span><span class="v" id="pours">4</span></div>
      </div>
      <div class="progress"><i id="prog"></i></div>
    </div>
    <div class="box">
      <h2>這一倒</h2>
      <div class="calc"><div class="chips" id="chips">0</div><div class="x">×</div><div class="mult" id="mult">1</div></div>
      <div class="rx" id="rx"><div class="empty">還沒有反應。每種不同的反應會讓倍率 +1。</div></div>
    </div>
    <div class="box">
      <h2>催化劑 <span id="catCount">0</span>/5</h2>
      <div class="cats" id="cats"><div class="muted">還沒有。過關後可以在商店購買。</div></div>
    </div>
    <div class="box">
      <h2>牌組（<span id="deckSize">0</span> 瓶）</h2>
      <div class="deck" id="deck"></div>
    </div>
  </aside>
</div>

<div class="overlay" id="overlay" hidden></div>

<script>
// Pour Decisions — falling-sand simulation core (prototype). Pure, deterministic given seed.
// Used by the browser prototype (inlined) and by node for headless balance tests.
(function (root) {
  const W = 80, H = 64;
  const M = { E:0, SAND:1, WATER:2, OIL:3, FIRE:4, LAVA:5, STONE:6, STEAM:7, ACID:8, POWDER:9, ICE:10, GLASS:11, SEED:12, PLANT:13, SMOKE:14, WALL:15, EMBER:16 };
  const KIND = [];   // 0 empty 1 powder 2 liquid 3 gas 4 solid
  const DEN = [];
  function def(id, kind, den) { KIND[id] = kind; DEN[id] = den; }
  def(M.E,0,0); def(M.SAND,1,6); def(M.WATER,2,3); def(M.OIL,2,2); def(M.FIRE,3,0.2);
  def(M.LAVA,2,5); def(M.STONE,4,9); def(M.STEAM,3,0.1); def(M.ACID,2,3.5); def(M.POWDER,1,5.5);
  def(M.ICE,1,4); def(M.GLASS,4,9); def(M.SEED,1,5); def(M.PLANT,4,9); def(M.SMOKE,3,0.05); def(M.WALL,4,99); def(M.EMBER,1,1);

  // reaction types: id -> base points
  const RX = {
    burn:     { pts: 2 },  // 燃燒
    quench:   { pts: 3 },  // 淬熄
    solidify: { pts: 8 },  // 凝岩
    dissolve: { pts: 3 },  // 溶蝕
    blast:    { pts: 12 }, // 爆炸
    vitrify:  { pts: 6 },  // 熔玻
    melt:     { pts: 3 },  // 融冰
    freeze:   { pts: 2 },  // 結凍
    bloom:    { pts: 3 },  // 萌芽
    condense: { pts: 1 },  // 凝結
    boil:     { pts: 2 },  // 沸騰
  };

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function createSim(seed, mods) {
    const N = W * H;
    const t = new Uint8Array(N), life = new Uint8Array(N), shade = new Uint8Array(N),
          stamp = new Uint16Array(N), flash = new Uint8Array(N);
    const rnd = mulberry32(seed >>> 0);
    const S = { W, H, t, life, shade, flash, frame: 0, activity: 0, counts: {}, mods: mods || {}, onEvent: null };

    function reset() {
      t.fill(0); life.fill(0); flash.fill(0);
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
        const p = y * W + x;
        if (x === 0 || x === W - 1 || y === H - 1) t[p] = M.WALL;
        shade[p] = (rnd() * 255) | 0;
      }
      S.counts = {};
    }
    S.reset = reset;
    S.resetCounts = () => { S.counts = {}; };

    function emit(type, p) {
      S.lastEventFrame = S.frame;
      S.counts[type] = (S.counts[type] || 0) + 1;
      flash[p] = 255;
      if (S.onEvent) S.onEvent(type, p);
    }
    function set(p, m, l) { t[p] = m; life[p] = l || 0; stamp[p] = S.frame & 0xffff; S.activity++; }
    function swap(p, q) {
      const a = t[p]; t[p] = t[q]; t[q] = a;
      const b = life[p]; life[p] = life[q]; life[q] = b;
      const c = shade[p]; shade[p] = shade[q]; shade[q] = c;
      stamp[q] = S.frame & 0xffff; stamp[p] = S.frame & 0xffff;
      S.activity++;
    }
    function gasLife(m) {
      if (m === M.FIRE) return 12 + ((rnd() * 18) | 0);
      if (m === M.STEAM) return 60 + ((rnd() * 80) | 0);
      if (m === M.SMOKE) return 40 + ((rnd() * 40) | 0);
      return 0;
    }

    function explode(cx, cy) {
      const r = 4 + (S.mods.demolition ? 2 : 0);
      for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
        if (dx * dx + dy * dy > r * r) continue;
        const x = cx + dx, y = cy + dy;
        if (x < 1 || x >= W - 1 || y < 0 || y >= H - 1) continue;
        const q = y * W + x, m = t[q];
        if (m === M.WALL) continue;
        if (m === M.WATER) { set(q, M.STEAM, gasLife(M.STEAM)); continue; }
        if (dx * dx + dy * dy <= 4 || m === M.POWDER || m === M.OIL || m === M.PLANT || m === M.SEED || m === M.E)
          set(q, M.FIRE, gasLife(M.FIRE));
        else if ((m === M.STONE || m === M.GLASS || m === M.ICE) && rnd() < 0.5) set(q, M.E);
      }
      emit('blast', cy * W + cx);
    }

    // returns true if cell p was consumed/changed (skip movement)
    function react(x, y, p, c) {
      const nb = [p - W, p + W, p - 1, p + 1];
      if (c === M.EMBER) {
        if (life[p] > 0) life[p]--;
        if (life[p] === 0) { set(p, M.FIRE, gasLife(M.FIRE)); return true; }
      }
      if (c === M.FIRE || c === M.EMBER) {
        for (let i = 0; i < 4; i++) {
          const q = nb[i], m = t[q];
          if (m === M.OIL) { set(q, M.FIRE, 30 + ((rnd() * 30) | 0)); emit('burn', q); }
          else if (m === M.PLANT || (m === M.SEED && rnd() < 0.5)) { set(q, M.FIRE, 25 + ((rnd() * 20) | 0)); emit('burn', q); }
          else if (m === M.POWDER) { explode(q % W, (q / W) | 0); return true; }
          else if (m === M.ICE && rnd() < 0.15) { set(q, M.WATER); emit('melt', q); }
          else if (m === M.WATER) { set(q, M.STEAM, gasLife(M.STEAM)); set(p, M.STEAM, gasLife(M.STEAM)); emit('quench', q); return true; }
        }
        return c === M.FIRE ? false : false;
      }
      if (c === M.LAVA) {
        for (let i = 0; i < 4; i++) {
          const q = nb[i], m = t[q];
          if (m === M.WATER) { set(p, M.STONE); set(q, M.STEAM, gasLife(M.STEAM)); emit('solidify', p); return true; }
          if (m === M.ICE && rnd() < 0.3) { set(q, M.WATER); emit('melt', q); if (rnd() < 0.15) { set(p, M.STONE); emit('solidify', p); return true; } }
          else if (m === M.SAND && rnd() < 0.04) { set(q, M.GLASS); emit('vitrify', q); }
          else if (m === M.OIL || m === M.PLANT || m === M.SEED) { set(q, M.FIRE, gasLife(M.FIRE) + 20); emit('burn', q); }
          else if (m === M.POWDER) { explode(q % W, (q / W) | 0); }
          else if (m === M.E && i === 0 && rnd() < 0.004) { set(q, M.FIRE, gasLife(M.FIRE)); }
        }
        return false;
      }
      if (c === M.ACID) {
        for (let i = 0; i < 4; i++) {
          const q = nb[i], m = t[q];
          if ((m === M.SAND || m === M.STONE || m === M.GLASS || m === M.ICE || m === M.PLANT || m === M.SEED || m === M.POWDER) && rnd() < 0.2) {
            set(q, rnd() < 0.3 ? M.SMOKE : M.E, gasLife(M.SMOKE)); emit('dissolve', q);
            if (!(S.mods.alkahest && rnd() < 0.7) && rnd() < 0.5) { set(p, M.E); return true; }
          }
        }
        return false;
      }
      if (c === M.WATER) {
        if (S.mods.hotplate && y === H - 2 && rnd() < 0.03) { set(p, M.STEAM, gasLife(M.STEAM)); emit('boil', p); return true; }
        for (let i = 0; i < 4; i++) {
          const q = nb[i], m = t[q];
          if (m === M.ICE && rnd() < (S.mods.freezer ? 0.03 : 0.003)) { set(p, M.ICE); emit('freeze', p); return true; }
          if (m === M.SEED) { set(q, M.PLANT); emit('bloom', q); if (rnd() < 0.5) { set(p, M.E); return true; } }
          if (m === M.PLANT && rnd() < (S.mods.greenhouse ? 0.06 : 0.02)) { set(p, M.PLANT); emit('bloom', p); return true; }
        }
        return false;
      }
      if (c === M.ICE && S.mods.hotplate && y === H - 2 && rnd() < 0.02) { set(p, M.WATER); emit('melt', p); return true; }
      return false;
    }

    function canDisplace(c, m) {
      if (m === M.E) return true;
      const k = KIND[m];
      if (k === 2 || k === 3) return DEN[m] < DEN[c];
      return false;
    }

    function update(x, y, p, c) {
      if (react(x, y, p, c)) return;
      const k = KIND[c];
      if (k === 1) { // powder
        const b = p + W;
        if (canDisplace(c, t[b])) { swap(p, b); return; }
        const d = rnd() < 0.5 ? -1 : 1;
        if (canDisplace(c, t[b + d])) { swap(p, b + d); return; }
        if (canDisplace(c, t[b - d])) { swap(p, b - d); return; }
      } else if (k === 2) { // liquid
        if (c === M.LAVA && rnd() < 0.5) return;
        const b = p + W;
        if (canDisplace(c, t[b])) { swap(p, b); return; }
        const d = rnd() < 0.5 ? -1 : 1;
        if (canDisplace(c, t[b + d])) { swap(p, b + d); return; }
        if (canDisplace(c, t[b - d])) { swap(p, b - d); return; }
        if (c === M.LAVA && rnd() < 0.6) return;
        const disp = c === M.LAVA ? 1 : 3;
        for (const dd of [d, -d]) {
          let q = p;
          for (let s = 1; s <= disp; s++) {
            const n = p + dd * s;
            if (canDisplace(c, t[n])) q = n; else break;
          }
          if (q !== p) { swap(p, q); return; }
        }
      } else if (k === 3) { // gas
        if (life[p] > 0) life[p]--;
        if (life[p] === 0) {
          if (c === M.STEAM && rnd() < 0.35) { set(p, M.WATER); emit('condense', p); }
          else if (c === M.FIRE && rnd() < 0.3) set(p, M.SMOKE, gasLife(M.SMOKE));
          else set(p, M.E);
          return;
        }
        if (c === M.FIRE && rnd() < 0.45) return;
        if (y <= 1) { if (rnd() < 0.5) set(p, M.E); return; }
        const u = p - W;
        const gasOk = (m) => m === M.E || (KIND[m] === 3 && DEN[m] > DEN[c]);
        if (gasOk(t[u]) && rnd() < 0.85) { swap(p, u); return; }
        const d = rnd() < 0.5 ? -1 : 1;
        if (gasOk(t[u + d])) { swap(p, u + d); return; }
        if (gasOk(t[p + d])) { swap(p, p + d); return; }
      }
    }

    S.step = function () {
      S.frame++;
      const fs = S.frame & 0xffff;
      S.activity = 0;
      for (let p = 0; p < N; p++) if (flash[p]) flash[p] = flash[p] > 40 ? flash[p] - 40 : 0;
      for (let y = H - 2; y >= 0; y--) {
        const ltr = (S.frame + y) & 1;
        for (let i = 1; i < W - 1; i++) {
          const x = ltr ? i : W - 1 - i;
          const p = y * W + x, c = t[p];
          if (c === M.E || c === M.WALL || c === M.STONE || c === M.GLASS || c === M.PLANT) {
            continue;
          }
          if (stamp[p] === fs) continue;
          update(x, y, p, c);
        }
      }
    };

    // pour `n` cells of material m around column x (called once per frame while pouring)
    S.pour = function (m, x, n) {
      let placed = 0;
      for (let i = 0; i < n * 3 && placed < n; i++) {

function buy(i) {
  const it = G.shopItems[i]; if (!it || it.bought) return;
  if (G.money < it.price) { flashMsg("錢不夠"); return; }
  if (it.kind === "cat" && G.cats.length >= MAX_CATS) { flashMsg("催化劑最多 5 個"); return; }
  G.money -= it.price; it.bought = true;
  if (it.kind === "vial") G.deck.push(it.m); else G.cats.push(it.c.id);
  renderSide(); showShop(it.kind === "vial" ? `已把「${VIALS[it.m].nm}」加入牌組。` : `已裝上「${it.c.nm}」。`);
}
function gameOver() {
  showOverlay(`<h3>實驗失敗</h3>
    <p>第 ${G.round + 1} 回合：${fmt(G.roundScore)} / ${fmt(TARGETS[G.round])} 分。</p>
    <p class="muted">提示：先倒「材料」佈置燒杯，最後再用火星或熔岩引爆；同一倒裡出現越多種反應，倍率越高。</p>
    <div class="row-actions"><span></span><button type="button" class="primary" id="again">再試一次</button></div>`);
  document.getElementById("again").addEventListener("click", () => { hideOverlay(); newGame(); });
}
function victory() {
  showOverlay(`<h3>全部 8 回合通關！</h3>
    <p>最後一回合得分 ${fmt(G.roundScore)}。你用了 ${G.cats.length} 個催化劑、${G.deck.length} 瓶材料。</p>
    <div class="row-actions"><span></span><button type="button" class="primary" id="again">再玩一局</button></div>`);
  document.getElementById("again").addEventListener("click", () => { hideOverlay(); newGame(); });
}
function showHelp(first) {
  showOverlay(`<h3>${first ? "POUR DECISIONS" : "玩法"}</h3>
    <ol class="howto">
      <li>從手牌選一瓶材料，在燒杯上<b>按住</b>倒出，按住時可以左右拖曳。</li>
      <li>材料會真的互相反應：水澆熄火、熔岩遇水凝成岩石、油遇火燃燒、酸溶蝕沙石、火藥連鎖爆炸……</li>
      <li>每一倒的分數 = 反應分數（藍）× 倍率（紅）。<b>同一倒裡每多一種反應，倍率 +1</b>，所以先佈置、再引爆。</li>
      <li>燒杯裡的東西會保留到回合結束。每回合 4 次倒料，達到目標就過關，到商店買新材料和催化劑。</li>
    </ol>
    <p class="muted">這是驗證核心玩法的灰盒原型：畫面、音效、數值都是暫定。</p>
    <div class="row-actions"><span></span><button type="button" class="primary" id="go">${first ? "開始實驗" : "繼續"}</button></div>`);
  document.getElementById("go").addEventListener("click", hideOverlay);
}
function ensureAudio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
}
document.getElementById("btnSound").addEventListener("click", e => {
  ensureAudio(); soundOn = !soundOn;
  e.currentTarget.textContent = soundOn ? "音效：開" : "音效：關";
  e.currentTarget.setAttribute("aria-pressed", String(soundOn));
});
document.getElementById("btnHelp").addEventListener("click", () => showHelp(false));
document.getElementById("btnRestart").addEventListener("click", () => newGame());

newGame();
showHelp(true);
requestAnimationFrame(loop);
})();
</script>
